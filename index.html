<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>StoreOps · Health Record</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* =============================================================
   StoreOps — Health Record
   Dense, utilitarian. Linear/Retool-ish. One accent.
   ============================================================= */

:root {
  --accent-h: 250;
  --accent: oklch(0.55 0.15 var(--accent-h));
  --accent-soft: oklch(0.96 0.025 var(--accent-h));
  --accent-fg: oklch(0.42 0.16 var(--accent-h));

  --ok:    oklch(0.62 0.13 155);
  --warn:  oklch(0.72 0.16 75);
  --bad:   oklch(0.6  0.18 20);
  --ok-soft:    oklch(0.96 0.04 155);
  --warn-soft:  oklch(0.96 0.05 75);
  --bad-soft:   oklch(0.96 0.04 20);

  /* warm neutrals */
  --bg:        oklch(0.99 0.003 80);
  --bg-elev:   oklch(1 0 0);
  --panel:     oklch(0.985 0.003 80);
  --rail-bg:   oklch(0.98 0.004 80);
  --nav-bg:    oklch(0.975 0.004 80);
  --hover:     oklch(0.965 0.006 80);
  --active:    oklch(0.94 0.01 var(--accent-h));

  --fg:        oklch(0.24 0.01 80);
  --fg-2:      oklch(0.36 0.008 80);
  --muted-fg:  oklch(0.56 0.005 80);
  --faint:     oklch(0.72 0.004 80);

  --border:    oklch(0.92 0.005 80);
  --border-2:  oklch(0.88 0.006 80);
  --border-strong: oklch(0.82 0.008 80);

  --kbd-bg:    oklch(0.97 0.005 80);

  --row: 30px;
  --row-tight: 26px;
  --pad-1: 6px;
  --pad-2: 10px;
  --pad-3: 14px;
  --pad-4: 20px;
  --pad-5: 28px;

  --radius: 4px;
  --radius-lg: 6px;

  --font-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  --t12: 11.5px;
  --t13: 12.5px;
  --t14: 13.5px;
  --t16: 15px;
  --t18: 17px;
  --t22: 22px;
}

[data-theme="dark"] {
  --bg:        oklch(0.17 0.005 260);
  --bg-elev:   oklch(0.2 0.005 260);
  --panel:     oklch(0.19 0.005 260);
  --rail-bg:   oklch(0.185 0.005 260);
  --nav-bg:    oklch(0.165 0.005 260);
  --hover:     oklch(0.225 0.006 260);
  --active:    oklch(0.27 0.04 var(--accent-h));

  --fg:        oklch(0.94 0.005 80);
  --fg-2:      oklch(0.84 0.005 80);
  --muted-fg:  oklch(0.62 0.005 80);
  --faint:     oklch(0.46 0.005 80);

  --border:    oklch(0.27 0.006 260);
  --border-2:  oklch(0.32 0.006 260);
  --border-strong: oklch(0.4 0.008 260);

  --kbd-bg:    oklch(0.24 0.006 260);

  --accent:    oklch(0.7 0.15 var(--accent-h));
  --accent-soft: oklch(0.28 0.06 var(--accent-h));
  --accent-fg:   oklch(0.85 0.13 var(--accent-h));

  --ok-soft:   oklch(0.28 0.05 155);
  --warn-soft: oklch(0.3 0.06 75);
  --bad-soft:  oklch(0.3 0.06 20);
}

[data-density="comfy"] {
  --row: 36px;
  --row-tight: 32px;
  --pad-1: 8px;
  --pad-2: 12px;
  --pad-3: 18px;
  --pad-4: 24px;
  --pad-5: 32px;
  --t13: 13px;
  --t14: 14px;
}

* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }
body {
  font-family: var(--font-ui);
  font-size: var(--t13);
  color: var(--fg);
  background: var(--bg);
  font-feature-settings: "cv02","cv03","cv04","cv11", "ss01", "tnum";
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.mono { font-family: var(--font-mono); font-feature-settings: "tnum"; font-size: 92%; letter-spacing: -0.01em; }
.muted-tx { color: var(--muted-fg); }
.grow { flex: 1 1 auto; }
.hrule { height: 1px; background: var(--border); }

/* APP SHELL */
.app {
  display: flex;
  flex-direction: row;
  height: 100vh;
  min-height: 100vh;
  overflow: hidden;
}

/* LEFT NAV */
.leftnav {
  background: var(--nav-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  width: 100%;
  min-width: 0;
}
.leftnav-head {
  display: flex; align-items: center; gap: 8px;
  padding: 12px var(--pad-3); border-bottom: 1px solid var(--border);
  height: 44px;
}
.brand { display: flex; align-items: center; gap: 8px; flex: 1; }
.brand-mark {
  width: 14px; height: 14px;
  background:
    linear-gradient(135deg, var(--accent) 0 50%, transparent 50% 100%),
    linear-gradient(135deg, transparent 0 50%, var(--fg) 50% 100%);
  border-radius: 2px;
}
.brand-word { font-weight: 600; letter-spacing: -0.01em; font-size: var(--t14); }
.iconbtn {
  background: transparent; border: 1px solid var(--border); border-radius: var(--radius);
  height: 24px; min-width: 24px; padding: 0 6px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--fg-2); cursor: pointer;
}
.iconbtn:hover { background: var(--hover); border-color: var(--border-2); color: var(--fg); }
.iconbtn.xs { height: 20px; min-width: 20px; }

.nav-section-label {
  padding: 14px var(--pad-3) 4px; font-size: var(--t12);
  text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted-fg);
}
.nav-list { list-style: none; margin: 0; padding: 0 6px; }
.nav-item {
  display: flex; align-items: center; gap: 8px;
  height: var(--row-tight); padding: 0 8px; border-radius: var(--radius);
  color: var(--fg-2); cursor: pointer; font-size: var(--t13);
}
.nav-item:hover { background: var(--hover); color: var(--fg); }
.nav-item.is-active { background: var(--active); color: var(--accent-fg); }
.nav-item.is-active .nav-count { color: var(--accent-fg); }
.nav-label { flex: 1; }
.nav-count { color: var(--muted-fg); font-size: var(--t12); }

.nav-store { gap: 8px; padding-right: 4px; }
.nav-store-id { color: var(--muted-fg); font-size: var(--t12); flex-shrink: 0; }
.nav-store-name {
  flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: var(--t13);
}

.leftnav-foot { margin-top: auto; padding: 10px var(--pad-3); border-top: 1px solid var(--border); }
.me { display: flex; align-items: center; gap: 8px; }
.me-text { line-height: 1.2; font-size: var(--t13); }
.me-sub { color: var(--muted-fg); font-size: var(--t12); }

/* AVATAR */
.avatar {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent-fg);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600;
  border: 1px solid color-mix(in oklab, var(--accent) 25%, var(--border));
  flex-shrink: 0;
}
.avatar-xs { width: 18px; height: 18px; font-size: 9px; }
.avatar-sm { width: 24px; height: 24px; font-size: 10px; }
.avatar-internal { background: var(--bg-elev); color: var(--fg-2); border-color: var(--border-2); }

/* DOTS, PILLS, KBD */
.dot { display: inline-block; border-radius: 50%; flex-shrink: 0; }
.pill {
  display: inline-flex; align-items: center; gap: 4px;
  height: 18px; padding: 0 6px; border-radius: 3px;
  font-size: 10.5px; font-weight: 500; letter-spacing: 0.02em; text-transform: lowercase;
  border: 1px solid var(--border-2); background: var(--bg-elev); color: var(--fg-2);
  white-space: nowrap;
}
.pill-blocker { background: var(--bad-soft); color: var(--bad); border-color: color-mix(in oklab, var(--bad) 35%, var(--border)); }
.pill-watch   { background: var(--warn-soft); color: oklch(0.42 0.12 75); border-color: color-mix(in oklab, var(--warn) 35%, var(--border)); }
.pill-info    { color: var(--muted-fg); }
.pill-accent  { background: var(--accent-soft); color: var(--accent-fg); border-color: color-mix(in oklab, var(--accent) 30%, var(--border)); }

[data-theme="dark"] .pill-watch { color: oklch(0.85 0.15 75); }

.kbd {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 16px; height: 16px; padding: 0 4px;
  border: 1px solid var(--border-2); border-bottom-width: 1.5px;
  border-radius: 3px; background: var(--kbd-bg);
  color: var(--muted-fg); font-family: var(--font-mono); font-size: 10px;
  margin-left: 2px;
}
[data-theme="dark"] .kbd { background: var(--kbd-bg); }

/* BUTTONS */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 26px; padding: 0 10px; border-radius: var(--radius);
  border: 1px solid var(--border-2); background: var(--bg-elev); color: var(--fg);
  font-size: var(--t13); font-family: inherit; cursor: pointer;
  white-space: nowrap;
}
.btn:hover { background: var(--hover); border-color: var(--border-strong); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { border-color: var(--border-2); background: var(--hover); }
.btn.primary { background: var(--accent); color: white; border-color: color-mix(in oklab, var(--accent) 70%, black); }
.btn.primary:hover { background: color-mix(in oklab, var(--accent) 90%, black); }
.btn.primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.sm { height: 22px; padding: 0 8px; font-size: var(--t12); }
.btn.full { width: 100%; justify-content: center; }
.btn.full .kbd { margin-left: auto; }

/* MAIN */
.main {
  display: flex; flex-direction: column;
  min-width: 0; min-height: 0; overflow: hidden;
  background: var(--bg);
}

/* HEADER */
.store-header {
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  padding: 0 var(--pad-4);
  flex-shrink: 0;
}
.crumbs {
  display: flex; align-items: center; gap: 6px;
  height: 36px; color: var(--muted-fg); font-size: var(--t12);
}
.crumb-current { color: var(--fg); }
.crumb-tail { color: var(--fg-2); }
.header-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }

.store-title-row {
  display: flex; align-items: baseline; gap: 16px;
  padding: 6px 0 12px;
  flex-wrap: wrap;
}
.store-title-left { display: flex; align-items: baseline; gap: 10px; flex: 1; min-width: 0; }
.store-title { margin: 0; font-size: var(--t22); font-weight: 600; letter-spacing: -0.015em; }
.store-sub { color: var(--muted-fg); font-size: var(--t13); }
.store-addr { color: var(--fg-2); font-size: var(--t13); }
.addr-sep { color: var(--faint); }
.store-title-right { display: flex; gap: 18px; }
.meta-stat { font-size: var(--t12); display: inline-flex; gap: 5px; align-items: baseline; }
.meta-k { color: var(--muted-fg); text-transform: uppercase; letter-spacing: 0.06em; }

/* PHASE STRIP — clickable */
.phase-strip {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
  padding-bottom: 12px;
}
.phase-seg {
  background: transparent; border: 0; padding: 0; text-align: left;
  cursor: pointer; font: inherit; color: inherit;
  border-radius: 3px;
  transition: background .12s ease;
}
.phase-seg:hover { background: var(--hover); }
.phase-seg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.phase-seg .phase-bar {
  height: 4px; border-radius: 2px;
  background: var(--border);
  overflow: hidden;
  position: relative;
}
.phase-bar-fill {
  height: 100%;
  width: 0;
  background: var(--accent);
  border-radius: 2px;
  transition: width .25s ease;
}
.phase-seg.is-not-started .phase-bar-fill { background: var(--border-strong); }
.phase-seg.is-active .phase-bar-fill { background: var(--accent); }
.phase-seg.is-active.is-blocked .phase-bar-fill { background: var(--bad); }
.phase-seg.is-active.is-watch .phase-bar-fill { background: var(--warn); }
.phase-seg.is-complete .phase-bar-fill { background: var(--accent); opacity: .7; }
.phase-label {
  display: flex; align-items: center; gap: 6px;
  margin-top: 6px; padding: 0 4px 4px;
  font-size: var(--t12); color: var(--muted-fg);
}
.phase-num { color: var(--faint); }
.phase-seg.is-active .phase-label { color: var(--fg); font-weight: 500; }
.phase-seg.is-complete .phase-label { color: var(--fg-2); }
.phase-seg.is-not-started .phase-label { color: var(--muted-fg); }
.phase-check { color: var(--accent); display: inline-flex; }
.phase-seg .phase-open[data-state="complete"] { background: transparent; color: var(--muted-fg); border-color: var(--border); }
.phase-seg .phase-open[data-state="not-started"] { background: transparent; color: var(--muted-fg); border-color: var(--border); }
.phase-seg.is-active:not(.is-blocked) .phase-open { background: var(--warn-soft); color: var(--warn); border-color: color-mix(in oklab, var(--warn) 25%, var(--border)); }

/* mini track legend in rail snapshot */
.track-mini { display: inline-flex; gap: 3px; align-items: center; }
.trk { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 3px; font: 600 10px var(--font-mono); border: 1px solid var(--border); background: var(--bg); color: var(--muted-fg); }
.trk-complete { background: color-mix(in oklab, var(--accent) 15%, var(--bg)); color: var(--accent); border-color: color-mix(in oklab, var(--accent) 30%, var(--border)); }
.trk-active { background: var(--warn-soft); color: var(--warn); border-color: color-mix(in oklab, var(--warn) 30%, var(--border)); }
.trk-blocked { background: var(--bad-soft); color: var(--bad); border-color: color-mix(in oklab, var(--bad) 30%, var(--border)); }
.trk-idle { background: transparent; color: var(--muted-fg); }
.phase-open {
  margin-left: auto; font-size: 10.5px;
  background: var(--bad-soft); color: var(--bad);
  padding: 0 5px; border-radius: 8px; line-height: 16px; height: 16px;
  border: 1px solid color-mix(in oklab, var(--bad) 25%, var(--border));
}

/* PHASE DRAWER */
.drawer-scrim {
  position: fixed; inset: 0;
  background: color-mix(in oklab, black 18%, transparent);
  display: flex; justify-content: flex-end;
  z-index: 95;
  animation: fadein .12s ease;
}
.phase-drawer {
  width: min(560px, 96vw);
  height: 100%;
  background: var(--bg-elev);
  border-left: 1px solid var(--border-strong);
  box-shadow: -16px 0 40px rgba(0,0,0,0.18);
  display: flex; flex-direction: column;
  animation: drawerin .18s ease;
}
@keyframes drawerin { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.drawer-head {
  display: flex; align-items: center; gap: 8px;
  padding: 10px var(--pad-3); border-bottom: 1px solid var(--border);
  background: var(--panel);
}
.drawer-crumb { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t13); }
.drawer-crumb svg { color: var(--muted-fg); }
.drawer-meta { padding: 12px var(--pad-3); border-bottom: 1px solid var(--border); }
.drawer-summary { margin: 0 0 10px; font-size: var(--t13); color: var(--fg-2); line-height: 1.5; }
.drawer-meta-row { display: flex; gap: 18px; flex-wrap: wrap; }
.drawer-tabs {
  display: flex; gap: 2px; padding: 0 var(--pad-3);
  border-bottom: 1px solid var(--border); background: var(--bg-elev);
}
.drawer-tab {
  background: transparent; border: 0; padding: 0 10px;
  height: 36px; font: inherit; color: var(--fg-2); cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  display: inline-flex; align-items: center; gap: 6px;
}
.drawer-tab:hover { color: var(--fg); }
.drawer-tab.is-active { color: var(--fg); border-bottom-color: var(--accent); }
.drawer-body { flex: 1; overflow-y: auto; padding: var(--pad-3); }
.drawer-checklist .check-row { grid-template-columns: 18px 28px 1fr auto auto; }
.drawer-checklist .check-box { cursor: pointer; }
.drawer-empty { padding: 20px; text-align: center; color: var(--muted-fg); font-size: var(--t13); border: 1px dashed var(--border-2); border-radius: var(--radius); }

.drawer-mini-composer { border: 1px solid var(--border-2); border-radius: var(--radius); background: var(--bg); margin-bottom: 12px; overflow: hidden; }
.drawer-mini-composer textarea { width: 100%; border: 0; padding: 10px; resize: vertical; font: inherit; background: transparent; color: var(--fg); outline: none; font-size: var(--t13); }
.drawer-comp-foot { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-top: 1px solid var(--border); background: var(--panel); font-size: var(--t12); }
.drawer-timeline { font-size: var(--t13); }

.drawer-task-form { border: 1px solid var(--border-2); border-radius: var(--radius); background: var(--bg); padding: 10px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.drawer-task-form input[type="text"], .drawer-task-form > input { border: 1px solid var(--border-2); border-radius: 3px; padding: 6px 10px; font: inherit; font-size: var(--t13); color: var(--fg); background: var(--bg-elev); outline: none; }
.drawer-task-form input:focus { border-color: var(--accent); }
.drawer-task-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.drawer-task-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); }
.drawer-task-row-item { display: grid; grid-template-columns: 14px 60px 1fr auto auto; gap: 10px; align-items: center; padding: 8px var(--pad-3); border-bottom: 1px solid var(--border); font-size: var(--t13); }
.drawer-task-row-item:last-child { border-bottom: 0; }
.drawer-task-title { color: var(--fg); }

/* TABS */
.tabs {
  display: flex; align-items: center; gap: 2px;
  padding: 0 var(--pad-4);
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  height: 38px;
  flex-shrink: 0;
}
.tab {
  display: inline-flex; align-items: center; gap: 6px;
  height: 38px; padding: 0 10px;
  border: 0; background: transparent; color: var(--fg-2);
  font: inherit; cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
.tab:hover { color: var(--fg); }
.tab.is-active { color: var(--fg); border-bottom-color: var(--accent); }
.tab-count { color: var(--muted-fg); }
.tabs-spacer { flex: 1; }
.tabs-search {
  display: inline-flex; align-items: center; gap: 6px;
  height: 24px; padding: 0 8px; border: 1px solid var(--border-2);
  border-radius: var(--radius); background: var(--bg-elev); color: var(--muted-fg);
  margin-left: 8px;
}
.tabs-search input {
  border: 0; background: transparent; outline: none; width: 180px;
  font: inherit; color: var(--fg);
}

/* CONTENT */
.content {
  display: flex;
  flex-direction: row;
  flex: 1; min-height: 0; overflow: hidden;
}
.content-main {
  overflow-y: auto;
  padding: var(--pad-4) var(--pad-4) 80px;
  min-width: 0;
}
.content-main::-webkit-scrollbar { width: 10px; height: 10px; }
.content-main::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 5px; }
.content-main::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

/* RIGHT RAIL */
.rail {
  border-left: 1px solid var(--border);
  background: var(--rail-bg);
  overflow-y: auto;
  padding: var(--pad-3) var(--pad-3) 80px;
  width: 100%;
  min-width: 0;
}
.rail::-webkit-scrollbar { width: 10px; }
.rail::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 5px; }
.rail-section { padding: 10px 4px; border-bottom: 1px solid var(--border); }
.rail-section:last-child { border-bottom: 0; }
.rail-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
.rail-head h4 { margin: 0; font-size: var(--t12); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted-fg); font-weight: 600; }

.ai-summary-text { margin: 0 0 8px; line-height: 1.55; color: var(--fg-2); font-size: var(--t13); }
.ai-summary-text b { color: var(--fg); font-weight: 600; }
.ai-cite { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 10px; font-size: var(--t12); }
.cite {
  display: inline-flex; align-items: center; height: 18px; padding: 0 6px;
  background: var(--accent-soft); color: var(--accent-fg);
  border: 1px solid color-mix(in oklab, var(--accent) 25%, var(--border));
  border-radius: 3px; cursor: pointer; text-decoration: none;
  font-size: 10.5px;
}
.cite:hover { background: color-mix(in oklab, var(--accent) 18%, var(--bg-elev)); }

.kv { margin: 0; display: grid; grid-template-columns: 100px 1fr; gap: 4px 12px; font-size: var(--t13); }
.kv dt { color: var(--muted-fg); }
.kv dd { margin: 0; color: var(--fg); display: flex; align-items: center; gap: 6px; }

.flag-list { list-style: none; padding: 0; margin: 0; }
.flag-row {
  display: flex; align-items: center; gap: 8px;
  height: var(--row-tight); padding: 0 4px;
  border-bottom: 1px dashed var(--border);
  font-size: var(--t13);
}
.flag-row:last-child { border-bottom: 0; }
.flag-label { flex: 1; }

.contacts { list-style: none; padding: 0; margin: 0; }
.contact-row { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-bottom: 1px dashed var(--border); }
.contact-row:last-child { border-bottom: 0; }
.contact-text { line-height: 1.25; min-width: 0; }
.contact-name { font-size: var(--t13); }
.contact-sub { font-size: var(--t12); color: var(--muted-fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* OVERVIEW */
.overview { display: flex; flex-direction: column; gap: 18px; }
.snap-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 0;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-elev);
  overflow: hidden;
}
.snap {
  padding: 12px var(--pad-3);
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 4px; min-width: 0;
}
.snap-wide { grid-column: span 2; }
.snap:nth-child(n+5) { border-bottom: 0; }
.snap-grid > .snap:last-child,
.snap-grid > .snap:nth-child(6n) { border-right: 0; }
.snap-label { font-size: var(--t12); color: var(--muted-fg); text-transform: uppercase; letter-spacing: 0.06em; }
.snap-value { font-size: var(--t18); font-weight: 600; display: flex; align-items: center; gap: 6px; letter-spacing: -0.01em; }
.snap-sub { font-size: var(--t12); color: var(--muted-fg); }

.block { border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-elev); }
.block-head {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 10px var(--pad-3); border-bottom: 1px solid var(--border);
}
.block-head h3 { margin: 0; font-size: var(--t13); font-weight: 600; }
.block-meta { font-size: var(--t12); color: var(--muted-fg); }

.blocker-list { display: flex; flex-direction: column; }
.blocker-row {
  display: grid;
  grid-template-columns: 24px 14px 1fr auto auto;
  align-items: center; gap: 10px;
  padding: 10px var(--pad-3);
  border-bottom: 1px solid var(--border);
}
.blocker-row:last-child { border-bottom: 0; }
.blocker-num { color: var(--faint); font-size: var(--t12); }
.blocker-title { font-size: var(--t13); color: var(--fg); }
.blocker-meta { font-size: var(--t12); color: var(--muted-fg); }
.blocker-age { color: var(--muted-fg); font-size: var(--t12); }

/* CHECKLIST */
.checklist { list-style: none; padding: 0; margin: 0; }
.check-row {
  display: grid;
  grid-template-columns: 18px 28px 1fr auto;
  align-items: center; gap: 10px;
  height: var(--row);
  padding: 0 var(--pad-3);
  border-bottom: 1px solid var(--border);
  font-size: var(--t13);
}
.check-row:last-child { border-bottom: 0; }
.check-row.is-done .check-label { color: var(--muted-fg); }
.check-num { color: var(--faint); font-size: var(--t12); }
.check-box {
  width: 14px; height: 14px; border: 1px solid var(--border-strong);
  border-radius: 3px; background: var(--bg);
  display: inline-flex; align-items: center; justify-content: center;
  color: white;
}
.check-box.is-on { background: var(--accent); border-color: var(--accent); }

/* TIMELINE */
.timeline-wrap { display: flex; flex-direction: column; gap: 10px; }
.timeline-filter { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 24px; padding: 0 9px;
  border: 1px solid var(--border-2); border-radius: 12px;
  background: var(--bg-elev); color: var(--fg-2);
  font: inherit; font-size: var(--t12); cursor: pointer;
}
.chip:hover { background: var(--hover); }
.chip.is-on { border-color: var(--accent); color: var(--accent-fg); background: var(--accent-soft); }
.chip-n { color: var(--muted-fg); }
.chip:disabled { opacity: 0.5; cursor: not-allowed; }
.chip.is-on .chip-n { color: var(--accent-fg); }

.timeline {
  list-style: none; margin: 0; padding: 0;
  border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-elev);
  overflow: hidden;
}
.tl-item {
  display: grid;
  grid-template-columns: 32px 1fr;
  border-bottom: 1px solid var(--border);
  position: relative;
}
.tl-item:last-child { border-bottom: 0; }
.tl-rail {
  display: flex; flex-direction: column; align-items: center;
  padding-top: 14px; position: relative;
}
.tl-rail::before {
  content: ""; position: absolute;
  top: 0; bottom: -1px; left: 50%;
  width: 1px; background: var(--border);
}
.tl-item:first-child .tl-rail::before { top: 14px; }
.tl-item:last-child .tl-rail::before { bottom: auto; height: 14px; }
.tl-dot {
  width: 16px; height: 16px;
  background: var(--bg-elev);
  border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  position: relative; z-index: 1;
  border: 1px solid var(--border);
}
.tl-body { padding: 10px var(--pad-3) 12px 0; min-width: 0; }
.tl-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; font-size: var(--t12); color: var(--muted-fg); }
.tl-time { color: var(--fg-2); }
.tl-kind {
  font-size: 10px; padding: 1px 5px; border-radius: 2px;
  background: var(--panel); color: var(--muted-fg);
  border: 1px solid var(--border);
  letter-spacing: 0.04em;
}
.tl-status .tl-kind { background: var(--bg); }
.tl-who { color: var(--fg-2); font-weight: 500; }
.tl-title { font-size: var(--t14); color: var(--fg); margin-bottom: 2px; }
.tl-text { font-size: var(--t13); color: var(--fg-2); line-height: 1.5; max-width: 70ch; }
.tl-attach {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 8px; padding: 4px 8px;
  border: 1px solid var(--border-2); border-radius: 3px;
  background: var(--panel); font-size: var(--t12); color: var(--fg-2);
}
.tl-mentions { margin-top: 6px; display: flex; gap: 6px; }
.mention {
  display: inline-flex; align-items: center; height: 18px; padding: 0 6px;
  background: var(--accent-soft); color: var(--accent-fg);
  border-radius: 9px; font-size: 11px;
}
.tl-status .tl-title { color: var(--muted-fg); font-weight: 400; font-size: var(--t13); }
.tl-status .tl-body { padding-bottom: 10px; padding-top: 8px; }
.tl-status .tl-meta { margin-bottom: 0; }

/* TASKS */
.tasks { display: flex; flex-direction: column; gap: 14px; }
.tasks-head { display: flex; align-items: baseline; justify-content: space-between; }
.tasks-head h3 { margin: 0; font-size: var(--t14); font-weight: 600; }
.task-cols {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.task-col {
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 8px; min-height: 200px;
  display: flex; flex-direction: column; gap: 6px;
}
.task-col-head {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 6px 8px; border-bottom: 1px solid var(--border);
  font-size: var(--t13); font-weight: 500;
  margin-bottom: 4px;
}
.task-col-n { margin-left: auto; color: var(--muted-fg); }
.task-card {
  border: 1px solid var(--border-2); border-radius: var(--radius);
  background: var(--bg); padding: 8px 10px;
  display: flex; flex-direction: column; gap: 6px;
  cursor: pointer;
}
.task-card:hover { border-color: var(--border-strong); }
.task-card.is-blocker { border-left: 2px solid var(--bad); }
.task-card-top { display: flex; align-items: center; justify-content: space-between; }
.task-id { color: var(--muted-fg); font-size: var(--t12); }
.task-card-title { font-size: var(--t13); line-height: 1.35; }
.task-card-foot { display: flex; align-items: center; gap: 6px; font-size: var(--t12); color: var(--muted-fg); }

/* FILES */
.files, .audit, .comms, .notes { display: flex; flex-direction: column; gap: 12px; }
.files-head { display: flex; align-items: baseline; justify-content: space-between; }
.files-head h3 { margin: 0; font-size: var(--t14); font-weight: 600; }

.ftbl, .audit-tbl {
  width: 100%; border-collapse: collapse;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg-elev); overflow: hidden;
  font-size: var(--t13);
}
.ftbl thead th {
  text-align: left; font-weight: 500; color: var(--muted-fg);
  font-size: var(--t12); text-transform: uppercase; letter-spacing: 0.06em;
  padding: 8px var(--pad-3); background: var(--panel); border-bottom: 1px solid var(--border);
}
.ftbl td { padding: 8px var(--pad-3); border-bottom: 1px solid var(--border); }
.ftbl tr:last-child td { border-bottom: 0; }
.ftbl tr:hover { background: var(--hover); }
.ftbl-name { display: inline-flex; align-items: center; gap: 6px; color: var(--fg); }
.ftbl-actions { width: 30px; text-align: right; }

/* AUDIT */
.audit-tbl { font-size: var(--t12); }
.audit-tbl td { padding: 6px var(--pad-3); border-bottom: 1px dashed var(--border); }
.audit-tbl tr:last-child td { border-bottom: 0; }
.audit-tbl tr:hover { background: var(--hover); }
.audit-t { color: var(--muted-fg); width: 150px; }
.audit-u { color: var(--fg-2); width: 100px; }
.audit-a { color: var(--accent-fg); width: 130px; }
.audit-d { color: var(--fg); }

/* COMMS */
.comms-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-elev); }
.comm-row { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 10px var(--pad-3); border-bottom: 1px solid var(--border); }
.comm-row:last-child { border-bottom: 0; }
.comm-t { color: var(--muted-fg); font-size: var(--t12); padding-top: 2px; }
.comm-line1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: var(--t12); color: var(--muted-fg); }
.comm-from { color: var(--fg-2); }
.comm-subj { font-size: var(--t13); color: var(--fg); margin: 2px 0 4px; }
.comm-snip { font-size: var(--t13); line-height: 1.5; max-width: 80ch; }
.tag {
  display: inline-flex; align-items: center; height: 16px; padding: 0 5px;
  border: 1px solid var(--border-2); border-radius: 2px;
  font-size: 10px; color: var(--muted-fg); background: var(--panel);
}

/* NOTES COMPOSER */
.note-composer {
  border: 1px solid var(--border-2); border-radius: var(--radius);
  background: var(--bg-elev); overflow: hidden;
}
.note-comp-head { display: flex; align-items: center; gap: 8px; padding: 8px var(--pad-3); border-bottom: 1px solid var(--border); font-size: var(--t13); }
.note-title-in {
  width: 100%; border: 0; border-bottom: 1px dashed var(--border);
  padding: 8px var(--pad-3); font: inherit; font-size: var(--t14); font-weight: 500;
  color: var(--fg); background: transparent; outline: none;
}
.note-title-in:focus { border-bottom-color: var(--accent); }
.note-composer textarea {
  width: 100%; border: 0; resize: vertical;
  padding: 10px var(--pad-3); font: inherit; color: var(--fg);
  background: transparent; outline: none;
  font-size: var(--t13); line-height: 1.5;
}
.note-comp-foot { display: flex; align-items: center; gap: 10px; padding: 8px var(--pad-3); border-top: 1px solid var(--border); background: var(--panel); font-size: var(--t12); flex-wrap: wrap; }
.comp-label { color: var(--muted-fg); text-transform: uppercase; letter-spacing: 0.06em; font-size: 10.5px; }
.check-inline { display: inline-flex; align-items: center; gap: 6px; color: var(--fg-2); cursor: pointer; user-select: none; }
.check-inline input { display: none; }
.check-box-sm {
  width: 14px; height: 14px; border: 1px solid var(--border-strong);
  border-radius: 3px; background: var(--bg);
  display: inline-flex; align-items: center; justify-content: center; color: white;
}
.check-box-sm.is-on { background: var(--accent); border-color: var(--accent); }
.action-toggle.is-on { color: var(--accent-fg); font-weight: 500; }
.due-inline { border: 1px solid var(--border-2); border-radius: 3px; padding: 2px 8px; height: 22px; font: inherit; font-family: var(--font-mono); font-size: 92%; color: var(--fg); background: var(--bg); outline: none; width: 90px; }
.due-inline:focus { border-color: var(--accent); }
.select-ish {
  border: 1px solid var(--border-2); background: var(--bg);
  border-radius: 3px; padding: 2px 6px; height: 22px;
  font: inherit; color: var(--fg-2); cursor: pointer;
}

/* SEVERITY SEGMENT (composer + flag modal) */
.sev-seg { display: inline-flex; border: 1px solid var(--border-2); border-radius: 3px; overflow: hidden; }
.sev-btn {
  display: inline-flex; align-items: center; gap: 5px;
  height: 22px; padding: 0 8px;
  background: var(--bg); color: var(--muted-fg);
  border: 0; border-right: 1px solid var(--border-2);
  font: inherit; font-size: 11.5px; cursor: pointer;
  text-transform: lowercase;
}
.sev-btn:last-child { border-right: 0; }
.sev-btn:hover { background: var(--hover); color: var(--fg-2); }
.sev-btn.is-on { color: var(--fg); font-weight: 500; }
.sev-btn.sev-blocker.is-on { background: var(--bad-soft); color: var(--bad); }
.sev-btn.sev-watch.is-on { background: var(--warn-soft); color: oklch(0.42 0.12 75); }
.sev-btn.sev-info.is-on { background: var(--accent-soft); color: var(--accent-fg); }
[data-theme="dark"] .sev-btn.sev-watch.is-on { color: oklch(0.85 0.15 75); }

/* FLAG MODAL */
.flag-modal { width: min(540px, 92vw); }
.flag-body { padding: var(--pad-3) var(--pad-4); display: flex; flex-direction: column; gap: 14px; }
.field { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 10px; }
.field-tall { align-items: start; }
.field-l { font-size: var(--t12); color: var(--muted-fg); text-transform: uppercase; letter-spacing: 0.06em; padding-top: 6px; }
.field input[type="text"], .field input:not([type]) {
  border: 1px solid var(--border-2); border-radius: var(--radius);
  height: 30px; padding: 0 10px; font: inherit; font-size: var(--t13); color: var(--fg);
  background: var(--bg); outline: none;
}
.field input:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea {
  border: 1px solid var(--border-2); border-radius: var(--radius);
  padding: 8px 10px; font: inherit; font-size: var(--t13); color: var(--fg);
  background: var(--bg); outline: none; resize: vertical; line-height: 1.5;
}
.field .sev-seg, .field select { justify-self: start; }
.flag-foot { display: flex; align-items: center; gap: 8px; padding: 10px var(--pad-3); border-top: 1px solid var(--border); background: var(--panel); }

/* RAIL FLAG ROW: add team chip + tighter layout */
.flag-row { display: grid; grid-template-columns: 14px 1fr auto auto; gap: 8px; }
.flag-team { font-size: 10.5px; color: var(--muted-fg); padding: 1px 5px; border: 1px solid var(--border-2); border-radius: 2px; background: var(--panel); }
.linkbtn { background: transparent; border: 0; color: var(--accent-fg); font: inherit; font-size: var(--t12); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; padding: 0; }
.linkbtn:hover { text-decoration: underline; }

/* TOAST */
.toast {
  position: fixed; bottom: 64px; right: 16px;
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--fg); color: var(--bg-elev);
  border-radius: 4px; padding: 8px 12px;
  font-size: var(--t13);
  box-shadow: 0 8px 24px rgba(0,0,0,0.18);
  z-index: 60;
  animation: toastin .18s ease;
}
.toast svg { color: var(--ok); }
@keyframes toastin { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

/* AI FAB */
.ai-fab {
  position: fixed; bottom: 16px; right: 16px;
  display: inline-flex; align-items: center; gap: 8px;
  height: 36px; padding: 0 14px;
  background: var(--fg); color: var(--bg-elev);
  border: 0; border-radius: 18px; cursor: pointer;
  box-shadow: 0 6px 24px rgba(0,0,0,0.16), 0 1px 2px rgba(0,0,0,0.08);
  font: inherit; font-size: var(--t13); font-weight: 500;
  z-index: 50;
}
.ai-fab:hover { transform: translateY(-1px); box-shadow: 0 10px 30px rgba(0,0,0,0.2), 0 1px 2px rgba(0,0,0,0.08); }
.ai-fab .kbd { background: color-mix(in oklab, var(--fg) 80%, white); color: var(--bg-elev); border-color: color-mix(in oklab, var(--fg) 70%, white); }
.ai-fab.is-open { background: var(--accent); color: white; }

/* AI MODAL */
.ai-modal-scrim {
  position: fixed; inset: 0;
  background: color-mix(in oklab, black 25%, transparent);
  backdrop-filter: blur(2px);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  animation: fadein .12s ease;
}
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.ai-modal {
  width: min(720px, 92vw);
  max-height: 80vh;
  background: var(--bg-elev);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  box-shadow: 0 24px 60px rgba(0,0,0,0.25), 0 4px 12px rgba(0,0,0,0.08);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.ai-modal-head {
  display: flex; align-items: center; gap: 8px;
  padding: 10px var(--pad-3); border-bottom: 1px solid var(--border);
  background: var(--panel);
}
.ai-modal-title { display: flex; align-items: center; gap: 8px; font-weight: 500; color: var(--fg); }
.ai-modal-title svg { color: var(--accent); }
.ai-modal-body {
  flex: 1; overflow-y: auto;
  padding: var(--pad-3) var(--pad-4);
  display: flex; flex-direction: column; gap: 14px;
  min-height: 200px;
}
.ai-msg { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: start; }
.ai-msg-role { font-size: 10px; color: var(--muted-fg); padding-top: 2px; letter-spacing: 0.06em; }
.ai-msg-text { font-size: var(--t13); line-height: 1.55; color: var(--fg); }
.ai-msg-user .ai-msg-text { color: var(--fg-2); }
.ai-typing { display: inline-flex; gap: 3px; padding: 4px 0; }
.ai-typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted-fg); animation: bounce 1s infinite; }
.ai-typing i:nth-child(2) { animation-delay: 0.15s; }
.ai-typing i:nth-child(3) { animation-delay: 0.3s; }
@keyframes bounce { 0%,60%,100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-2px); } }

.ai-modal-suggest {
  display: flex; gap: 6px; flex-wrap: wrap;
  padding: 8px var(--pad-4); border-top: 1px solid var(--border);
  background: var(--panel);
}
.ai-modal-input {
  display: flex; align-items: center; gap: 8px;
  padding: 10px var(--pad-3); border-top: 1px solid var(--border);
  background: var(--bg-elev);
}
.ai-modal-input input {
  flex: 1; border: 1px solid var(--border-2); border-radius: var(--radius);
  height: 32px; padding: 0 12px; font: inherit; font-size: var(--t14); color: var(--fg);
  background: var(--bg); outline: none;
}
.ai-modal-input input:focus { border-color: var(--accent); }
.ai-modal-input .btn { height: 32px; }

/* RESPONSIVE TRIM */
@media (max-width: 1280px) {
  .store-title-right { display: none; }
  .snap-grid { grid-template-columns: repeat(3, 1fr); }
  .snap-grid > .snap { border-bottom: 1px solid var(--border); }
  .snap-grid > .snap:nth-child(6n) { border-right: 0; }
  .snap-grid > .snap:nth-child(3n) { border-right: 0; }
  .snap-grid > .snap:nth-last-child(-n+3) { border-bottom: 0; }
}
@media (max-width: 1100px) {
  .content { flex-direction: column; }
  .rail { display: none; }
}

/* hide kbd hints when toggle off */
[data-show-kbd="false"] .kbd { display: none; }

/* DRAWER TAB COUNT */
.tab-count {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: 8px; font-size: 10px;
  background: var(--panel); color: var(--muted-fg);
  border: 1px solid var(--border);
}
.drawer-tab.is-active .tab-count {
  background: var(--accent-soft); color: var(--accent-fg);
  border-color: color-mix(in oklab, var(--accent) 25%, var(--border));
}

/* FOCUS VISIBLE — accessibility */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
button:focus-visible { outline-offset: 1px; }

/* SCROLLBAR — rail parity */
.rail::-webkit-scrollbar-track,
.content-main::-webkit-scrollbar-track { background: transparent; }

/* PRINT */
@media print {
  .leftnav, .rail, .ai-fab, .toast, .twk-panel { display: none !important; }
  .app { grid-template-columns: 1fr; }

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}

}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}

}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

const cx = (...c) => c.filter(Boolean).join(" ");

function Dot({ tone = "neutral", size = 8 }) {
  const map = {
    green: "var(--ok)", yellow: "var(--warn)", red: "var(--bad)",
    blocker: "var(--bad)", watch: "var(--warn)", info: "var(--muted-fg)",
    neutral: "var(--muted-fg)", accent: "var(--accent)"
  };
  return <span className="dot" style={{ width: size, height: size, background: map[tone] || map.neutral }} />;
}

function Pill({ children, tone = "neutral", mono, style }) {
  return <span className={cx("pill", `pill-${tone}`, mono && "mono")} style={style}>{children}</span>;
}

function Kbd({ children }) {
  return <kbd className="kbd">{children}</kbd>;
}

function HRule() {return <div className="hrule" />;}

  spark: () => <svg viewBox="0 0 16 16" width="12" height="12"><path d="M8 2l1.4 4.2L13.6 8 9.4 9.4 8 14l-1.4-4.6L2 8l4.6-1.8z" fill="currentColor" /></svg>,
  dot3: () => <svg viewBox="0 0 16 16" width="12" height="12"><circle cx="3" cy="8" r="1.2" fill="currentColor" /><circle cx="8" cy="8" r="1.2" fill="currentColor" /><circle cx="13" cy="8" r="1.2" fill="currentColor" /></svg>,
  link: () => <svg viewBox="0 0 16 16" width="11" height="11"><path d="M6 9.5L9.5 6M6.5 4h2a3 3 0 010 6h-1m1 2h-2a3 3 0 010-6h1" fill="none" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" /></svg>,

function PhaseStrip({ onSelect }) {
  return (
    <div className="phase-strip" role="list" aria-label="Workstream tracks">
      {PHASES.map((p) => {
        const d = PHASE_DETAIL[p];
        const { total, done, blocked, watch, state } = trackState(p, d);
        const pct = total ? Math.round((done / total) * 100) : 0;
        return (
          <button key={p} role="listitem"
            className={cx("phase-seg", `is-${state}`, blocked && "is-blocked", watch && !blocked && state === "active" && "is-watch")}
            onClick={() => onSelect(p)}
            title={`${p} — ${done}/${total} subtasks${blocked?" · blocker":watch?" · watch":""}`}>
            <div className="phase-bar"><div className="phase-bar-fill" style={{ width: pct + "%" }} /></div>
            <div className="phase-label">
              <span>{p}</span>
              {state === "complete" && <span className="phase-check"><Icon.check /></span>}
              {blocked && <Dot tone="red" />}
              {!blocked && watch && state === "active" && <Dot tone="yellow" />}
              <span className="phase-open mono" data-state={state}>{done}/{total}</span>
            </div>
          </button>);
      })}
    </div>);
}

// TRACK DRAWER

function PhaseDrawer({ phase, onClose, onPostNote, onCreateTask, onToggleSub, subState, phaseTasks, phaseNotes }) {
  const [tab, setTab] = useState("checklist");
  const [noteText, setNoteText] = useState("");
  const [taskTitle, setTaskTitle] = useState("");
  const [taskTeam, setTaskTeam] = useState("Implementation");
  const [taskDue, setTaskDue] = useState("");

  useEffect(() => {
    if (!phase) return;
    const onKey = e => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [phase, onClose]);

  if (!phase) return null;
  const d = PHASE_DETAIL[phase];
  const subs = d.subtasks.map((s, i) => ({ ...s, done: subState[`${phase}:${i}`] ?? s.done, _i: i }));
  const completed = subs.filter(s => s.done).length;
  const liveBlocked = subs.some(s => !s.done && s.flag === "blocker");
  const liveWatch = subs.some(s => !s.done && s.flag === "watch");
  const state = completed === subs.length ? "complete" : completed === 0 ? "not-started" : "active";
  const stateLabel = state === "complete" ? "complete" : state === "not-started" ? "not started" : (liveBlocked ? "blocked" : liveWatch ? "at risk" : "active");

  const submitNote = (e) => {
    e.preventDefault();
    if (!noteText.trim()) return;
    onPostNote(phase, noteText.trim());
    setNoteText("");
  };
  const submitTask = (e) => {
    e.preventDefault();
    if (!taskTitle.trim()) return;
    onCreateTask(phase, { title: taskTitle.trim(), team: taskTeam, due: taskDue.trim() || "—" });
    setTaskTitle(""); setTaskDue("");
  };

  return (
    <div className="drawer-scrim" onMouseDown={onClose}>
      <aside className="phase-drawer" onMouseDown={e => e.stopPropagation()}>
        <header className="drawer-head">
          <div className="drawer-crumb mono">
            <span className="muted-tx">Track</span>
            <Icon.chevR/>
            <span>{phase}</span>
            <Pill tone={state==="complete"?"info":liveBlocked?"blocker":liveWatch?"watch":state==="not-started"?"info":"watch"}>{stateLabel}</Pill>
          </div>
          <div className="grow"/>
          <span className="muted-tx mono"><Kbd>esc</Kbd></span>
          <button className="iconbtn" onClick={onClose}><Icon.close/></button>
        </header>
        <div className="drawer-meta">
          <p className="drawer-summary">{d.summary}</p>
          <div className="drawer-meta-row">
            <span className="meta-stat"><span className="meta-k">Owner</span> <span>{d.owner}</span></span>
            <span className="meta-stat"><span className="meta-k">When</span> <span className="mono">{d.completed}</span></span>
            <span className="meta-stat"><span className="meta-k">Progress</span> <span className="mono">{completed}/{subs.length}</span></span>
          </div>
        </div>
        <div className="drawer-tabs">
          {[
            { id: "checklist", label: "Checklist", n: subs.length },
            { id: "notes", label: "Notes", n: phaseNotes.length },
            { id: "tasks", label: "Tasks", n: phaseTasks.length },
          ].map(t => (
            <button key={t.id} className={cx("drawer-tab", tab===t.id && "is-active")} onClick={()=>setTab(t.id)}>
              {t.label} <span className="mono tab-count">{t.n}</span>
            </button>
          ))}
        </div>
        <div className="drawer-body">
          {tab === "checklist" && (
            <ul className="checklist drawer-checklist">
              {subs.map((s) => (
                <li key={s._i} className={cx("check-row", s.done && "is-done")}>
                  <button className={cx("check-box", s.done && "is-on")} onClick={() => onToggleSub(phase, s._i)}>
                    {s.done && <Icon.check/>}
                  </button>
                  <span className="mono check-num">{String(s._i+1).padStart(2,"0")}</span>
                  <span className="check-label">{s.label}</span>
                  <span className="flag-team mono">{s.team}</span>
                  {s.flag && !s.done && <Pill tone={s.flag}>{s.flag}</Pill>}
                </li>
              ))}
            </ul>
          )}
          {tab === "notes" && (
            <div className="drawer-notes">
              <form className="drawer-mini-composer" onSubmit={submitNote}>
                <textarea
                  rows={2}
                  placeholder={`Add a note for ${phase}…`}
                  value={noteText}
                  onChange={e=>setNoteText(e.target.value)}
                  onKeyDown={e=>{ if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){ submitNote(e);} }}
                />
                <div className="drawer-comp-foot">
                  <span className="muted-tx mono"><Kbd>⌘</Kbd>+<Kbd>↵</Kbd> post</span>
                  <div className="grow"/>
                  <button className="btn primary" disabled={!noteText.trim()}><Icon.arrowU/> Post</button>
                </div>
              </form>
              {phaseNotes.length === 0 ? (
                <div className="drawer-empty">No notes scoped to this phase yet.</div>
              ) : (
                <ol className="timeline drawer-timeline">
                  {phaseNotes.map((e, i) => <TimelineItem key={i} e={e}/>)}
                </ol>
              )}
            </div>
          )}
          {tab === "tasks" && (
            <div className="drawer-tasks">
              <form className="drawer-task-form" onSubmit={submitTask}>
                <input placeholder={`New task for ${phase}…`} value={taskTitle} onChange={e=>setTaskTitle(e.target.value)}/>
                <div className="drawer-task-row">
                  <span className="comp-label">assign</span>
                  <select className="select-ish mono" value={taskTeam} onChange={e=>setTaskTeam(e.target.value)}>
                    {TEAMS.map(t => <option key={t.id}>{t.id}</option>)}
                  </select>
                  <span className="comp-label">due</span>
                  <input className="due-inline mono" placeholder="May 6" value={taskDue} onChange={e=>setTaskDue(e.target.value)}/>
                  <div className="grow"/>
                  <button className="btn primary" disabled={!taskTitle.trim()}><Icon.plus/> Create task</button>
                </div>
              </form>
              {phaseTasks.length === 0 ? (
                <div className="drawer-empty">No tasks scoped to this phase yet.</div>
              ) : (
                <ul className="drawer-task-list">
                  {phaseTasks.map((t, i) => (
                    <li key={i} className="drawer-task-row-item">
                      <Dot tone={t.state==="Done"?"green":t.state==="Waiting"?"yellow":"neutral"}/>
                      <span className="mono task-id">{t.id}</span>
                      <span className="drawer-task-title">{t.title}</span>
                      <span className="flag-team mono">{t.team || t.owner}</span>
                      <span className="muted-tx mono">{t.due}</span>
                    </li>
                  ))}
                </ul>
              )}
            </div>
          )}
        </div>
      </aside>
    </div>
  );
}

// ============================================================
// GLOBAL CHECKLIST — stored in localStorage, same across stores
// ============================================================
const CHECKLIST_KEY = "storeops_checklist_items";
const CHECKLIST_DONE_KEY = "storeops_checklist_done";

function getChecklistItems() {
  try {
    const stored = localStorage.getItem(CHECKLIST_KEY);
    if (stored) return JSON.parse(stored);
  } catch {}
  return ["Site Survey", "Store Design", "COI/Permits", "Install crew confirmed", "Day-of contact tree"];
}
function saveChecklistItems(items) {
  try { localStorage.setItem(CHECKLIST_KEY, JSON.stringify(items)); } catch {}
}
function getChecklistDone(storeId) {
  try {
    const stored = localStorage.getItem(`${CHECKLIST_DONE_KEY}_${storeId}`);
    if (stored) return JSON.parse(stored);
  } catch {}
  return {};
}
function saveChecklistDone(storeId, done) {
  try { localStorage.setItem(`${CHECKLIST_DONE_KEY}_${storeId}`, JSON.stringify(done)); } catch {}
}

// ============================================================
// OVERVIEW (snapshot blocks) — editable fields
// ============================================================
function Overview({ store = STORE, onSaveStore }) {
  // Editable snap fields
  const [editField, setEditField] = useState(null); // which field is being edited
  const [editVal, setEditVal]     = useState("");

  // Checklist
  const [checkItems, setCheckItems] = useState(getChecklistItems);
  const [checkDone, setCheckDone]   = useState(() => getChecklistDone(store.id));
  const [newItem, setNewItem]       = useState("");
  const [addingItem, setAddingItem] = useState(false);

  const doneCount = checkItems.filter((_, i) => checkDone[i]).length;

  const startEdit = (field, currentVal) => { setEditField(field); setEditVal(currentVal || ""); };
  const saveField = (field, directVal) => {
    const val = directVal !== undefined ? directVal : editVal.trim();
    if (onSaveStore) onSaveStore({ ...store, [field]: val });
    setEditField(null);
    setEditVal("");
  };
  const cancelEdit = () => setEditField(null);

  const toggleCheck = (i) => {
    const next = { ...checkDone, [i]: !checkDone[i] };
    setCheckDone(next);
    saveChecklistDone(store.id, next);
  };
  const addCheckItem = () => {
    if (!newItem.trim()) return;
    const next = [...checkItems, newItem.trim()];
    setCheckItems(next);
    saveChecklistItems(next);
    setNewItem(""); setAddingItem(false);
  };
  const removeCheckItem = (i) => {
    const next = checkItems.filter((_, idx) => idx !== i);
    setCheckItems(next);
    saveChecklistItems(next);
    const nextDone = { ...checkDone };
    delete nextDone[i];
    // re-index done state
    const reindexed = {};
    next.forEach((_, newIdx) => {
      const oldIdx = checkItems.indexOf(next[newIdx]);
      if (checkDone[oldIdx]) reindexed[newIdx] = true;
    });
    setCheckDone(reindexed);
    saveChecklistDone(store.id, reindexed);
  };

  const EditableSnap = ({ label, field, value, sub, tone, wide, mono, multiLine, type="text", options=[] }) => {
    const isEditing = editField === field;
    const rawVal = store[field] || "";
    return (
      <div className={cx("snap snap-editable", wide && "snap-wide")} onClick={() => !isEditing && startEdit(field, rawVal)}>
        <div className="snap-label">{label}</div>
        {isEditing ? (
          <div className="snap-edit-form" onClick={(e) => e.stopPropagation()}>
            {type === "select" ? (
              <select className="snap-edit-input select-ish mono" autoFocus value={editVal}
                onChange={(e) => { setEditVal(e.target.value); saveField(field, e.target.value); }}>
                {options.map((o) => <option key={o} value={o}>{o.charAt(0).toUpperCase()+o.slice(1)}</option>)}
              </select>
            ) : type === "date" ? (
              <input className="snap-edit-input" type="date" autoFocus
                value={editVal ? new Date(editVal).toISOString().slice(0,10) : ""}
                onChange={(e) => {
                  const d = e.target.value ? new Date(e.target.value).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) : "";
                  setEditVal(d); saveField(field, d);
                }} />
            ) : multiLine ? (
              <textarea className="snap-edit-input" rows={2} autoFocus value={editVal}
                onChange={(e) => setEditVal(e.target.value)}
                onKeyDown={(e) => { if (e.key==="Enter"&&!e.shiftKey){e.preventDefault();saveField(field);} if(e.key==="Escape")cancelEdit(); }} />
            ) : (
              <input className="snap-edit-input" autoFocus value={editVal}
                onChange={(e) => setEditVal(e.target.value)}
                onKeyDown={(e) => { if(e.key==="Enter")saveField(field); if(e.key==="Escape")cancelEdit(); }} />
            )}
            {type !== "select" && type !== "date" && (
              <div style={{display:"flex",gap:4,marginTop:4}}>
                <button className="btn primary sm" onClick={() => saveField(field)}><Icon.check /></button>
                <button className="btn ghost sm" onClick={cancelEdit}>✕</button>
              </div>
            )}
          </div>
        ) : (
          <>
            <div className={cx("snap-value", mono && "mono")}>
              {tone && <Dot tone={tone} />}
              <span>{value}</span>
            </div>
            <div className="snap-sub">{sub}</div>
            <div className="snap-edit-hint">click to edit</div>
          </>
        )}
      </div>
    );
  };


  return (
    <div className="overview">
      <div className="snap-grid">
        <EditableSnap label="Phase" field="phase" value={store.phase} sub={`Health: ${store.health}`} tone={store.health==="yellow"?"yellow":store.health==="red"?"red":"green"}
          type="select" options={["Planning","Scheduled","COI","Deployment","Live"]} />
        <EditableSnap label="Health" field="health" value={store.health?.charAt(0).toUpperCase()+store.health?.slice(1)} sub="Select health status" tone={store.health}
          type="select" options={["green","yellow","red"]} />
        <EditableSnap label="Owner" field="ownerPerson" value={store.ownerPerson||"—"} sub={store.owner||""}
          type="select" options={TEAMS.map(t=>t.id)} optionLabel="Team" secondField="owner" secondOptions={TEAMS.map(t=>t.id)} />
        <EditableSnap label="Next action" field="nextAction" value={store.nextAction||"No action set"} sub={store.due ? `Due ${store.due}` : "No due date"} tone={store.nextAction?"yellow":null} wide multiLine />
        <EditableSnap label="Risk level" field="risk" value={store.risk?.charAt(0).toUpperCase()+store.risk?.slice(1)||"Low"} sub="Click to change"
          tone={store.risk==="high"?"red":store.risk==="medium"?"yellow":"green"}
          type="select" options={["low","medium","high"]} />
        <EditableSnap label="Go-live target" field="scheduledLive" value={store.scheduledLive||"Not set"} sub={store.openedOn?`Opened ${store.openedOn}`:""} mono type="date" />
      </div>

      <section className="block">
        <header className="block-head">
          <h3>Readiness checklist</h3>
          <span className="block-meta mono">{doneCount}/{checkItems.length} complete</span>
        </header>
        <ul className="checklist">
          {checkItems.map((label, i) => (
            <li key={i} className={cx("check-row checklist-editable", checkDone[i] && "is-done")}>
              <button className={cx("check-box", checkDone[i] && "is-on")} onClick={() => toggleCheck(i)}>
                {checkDone[i] && <Icon.check />}
              </button>
              <span className="mono check-num">{String(i + 1).padStart(2, "0")}</span>
              <span className="check-label">{label}</span>
              <button className="iconbtn xs" style={{opacity:0.4,marginLeft:"auto"}} title="Remove"
                onClick={() => removeCheckItem(i)}>✕</button>
            </li>
          ))}
          {addingItem ? (
            <li className="check-row">
              <span className="check-box" />
              <span className="mono check-num">{String(checkItems.length + 1).padStart(2,"0")}</span>
              <input className="checklist-new-input" autoFocus placeholder="New checklist item…"
                value={newItem} onChange={(e) => setNewItem(e.target.value)}
                onKeyDown={(e) => { if (e.key==="Enter") addCheckItem(); if (e.key==="Escape") { setAddingItem(false); setNewItem(""); } }} />
              <button className="btn primary sm" onClick={addCheckItem} disabled={!newItem.trim()}><Icon.check /></button>
              <button className="btn ghost sm" onClick={() => { setAddingItem(false); setNewItem(""); }}>✕</button>
            </li>
          ) : (
            <li className="check-row" style={{borderBottom:0}}>
              <button className="btn ghost sm" style={{margin:"4px var(--pad-3)"}} onClick={() => setAddingItem(true)}>
                <Icon.plus /> Add item
              </button>
            </li>
          )}
        </ul>
      </section>
    </div>);
}

function SnapBlock({ label, value, sub, tone, wide, mono }) {

function Audit({ entries = [], tasks = [], files = [] }) {
  // Build audit rows from real activity across entries, tasks, files
  const rows = [];

  entries.forEach((e) => {
    const actor = e.who === "system" ? "system" : (e.who || "").split(" ").map((w,i) => i===0 ? w.toLowerCase().slice(0,6)+"@" : "").join("").replace("@","@");
    const shortWho = e.who === "system" ? "system" : (e.who||"").split(" ").map(w=>w[0]).join("").toLowerCase()+"@";
    const ts = e.created_at ? new Date(e.created_at).toISOString().replace("T"," ").slice(0,19) : (e.t || "—");
    rows.push([ts, shortWho, `${e.kind}.create`, `sev=${e.sev||"info"}${e.action?" action=true":""}`]);
  });

  tasks.forEach((t) => {
    rows.push(["—", (t.owner||"?").split(" ").map(w=>w[0]).join("").toLowerCase()+"@", "task.create", `id=${t.id} state=${t.state}`]);
  });

  files.forEach((f) => {
    rows.push([f.when||"—", (f.who||"system"), "file.upload", `name=${f.name} size=${f.size||"?"}`]);
  });

  // Sort newest first by timestamp string
  rows.sort((a, b) => b[0].localeCompare(a[0]));

  return (
    <div className="audit">
      <div className="files-head">
        <h3>Audit log <span className="muted-tx mono">{rows.length}</span></h3>
        <span className="muted-tx mono">immutable · auto-generated</span>
      </div>
      {rows.length === 0 ? (
        <div style={{padding:"48px 20px",textAlign:"center",color:"var(--muted-fg)",fontSize:"var(--t13)"}}>
          No activity yet. The audit log will populate as notes, tasks, and files are added.
        </div>
      ) : (
        <table className="audit-tbl mono">
          <thead>
            <tr style={{background:"var(--panel)"}}>
              <th className="audit-t" style={{padding:"6px 8px",fontWeight:600,fontSize:"var(--t11)",color:"var(--muted-fg)",textTransform:"uppercase"}}>Timestamp</th>
              <th className="audit-u" style={{padding:"6px 8px",fontWeight:600,fontSize:"var(--t11)",color:"var(--muted-fg)",textTransform:"uppercase"}}>User</th>
              <th className="audit-a" style={{padding:"6px 8px",fontWeight:600,fontSize:"var(--t11)",color:"var(--muted-fg)",textTransform:"uppercase"}}>Action</th>
              <th className="audit-d" style={{padding:"6px 8px",fontWeight:600,fontSize:"var(--t11)",color:"var(--muted-fg)",textTransform:"uppercase"}}>Detail</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r, i) => (
              <tr key={i}>
                <td className="audit-t">{r[0]}</td>
                <td className="audit-u">{r[1]}</td>
                <td className="audit-a">{r[2]}</td>
                <td className="audit-d">{r[3]}</td>
              </tr>
            ))}
          </tbody>
        </table>
      )}
    </div>
  );
}

function AIModal({ open, onClose }) {
  const [messages, setMessages] = useState([
  { role: "ai", text: `Asking about ${STORE.retailer} #${STORE.storeNum}. I have access to all notes, tasks, comms, and files for this store.` }]
  );
  const [input, setInput] = useState("");
  const [busy, setBusy] = useState(false);
  const scrollRef = useRef();

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, busy]);

  useEffect(() => {
    if (!open) return;
    const onKey = (e) => {if (e.key === "Escape") onClose();};
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [open, onClose]);

  const send = async (q) => {
    const text = (q ?? input).trim();
    if (!text || busy) return;
    setMessages((m) => [...m, { role: "user", text }]);
    setInput("");
    setBusy(true);
    try {
      const ctx = `You are StoreOps AI, an assistant grounded in a single store's records. Answer concisely (3-6 sentences max), in plain prose, and cite specific records by inline tag like [N-2241] or [T-1041] when relevant. Never invent records.

STORE: ${STORE.retailer} #${STORE.storeNum} (${STORE.id}) — ${STORE.address}
PHASE: COI day 10 (target ≤7), health=yellow auto-flagged Apr 30
OWNER: Implementation / Priya Shah
NEXT: Signed COI rev. 3 from WFM legal due May 6
RISK: Medium. Install crew reserved May 18 0500-1100, releases May 12 if COI not cleared.

KEY RECORDS:
- [N-2241] Apr 30: COI rev. 3 sent to Marcus Webb (WFM legal); expected back Mon May 4. action=true sev=blocker
- [N-2235] Apr 27: Power audit — 2/6 fixtures need 20A circuits; retailer-side per MSA §4.2; quoted $2,400. sev=watch
- [N-2230] Apr 24: Planogram approved by Lena Park (WFM grocery cat mgr). 142 fixtures.
- [T-1041] Apr 29: Install crew reserved for May 18. state=Done
- [T-1042] OPEN: Get signed COI rev. 3 from WFM legal. due=May 6. flag=blocker
- [T-1043] OPEN: File 20A circuit work order with retailer ops. due=May 8
- [C-0418] Apr 28: Email from Marcus Webb re: insurance language ("each location" vs "site-specific")

CONTACTS: Marcus Webb (WFM legal, primary), Lena Park (WFM grocery cat mgr), Dan Ortiz (WFM #1247 store mgr), Priya Shah (impl lead), Jordan Reyes (deployment)

Question: ${text}`;

      // ── Call the Anthropic API ─────────────────────────────────────────────
      // In production, proxy through a Supabase Edge Function so your key
      // stays server-side.  Set window.__STOREOPS_CONFIG__.anthropicKey for
      // local dev, or deploy /supabase/functions/ai-proxy/index.ts (see the
      // README) and leave anthropicKey blank.
      // ──────────────────────────────────────────────────────────────────────
      const cfg   = window.__STOREOPS_CONFIG__ || {};
      const apiKey = cfg.anthropicKey || "";
      const proxyUrl = cfg.supabaseUrl
        ? `${cfg.supabaseUrl}/functions/v1/ai-proxy`
        : null;

      let reply;
      if (apiKey) {
        // Direct dev call (key in browser config — never do this in production)
        const res = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: {
            "x-api-key": apiKey,
            "anthropic-version": "2023-06-01",
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            model: "claude-sonnet-4-20250514",
            max_tokens: 800,
            messages: [{ role: "user", content: ctx }],
          }),
        });
        if (!res.ok) throw new Error("anthropic_error");
        const data = await res.json();
        reply = data.content?.[0]?.text ?? "(empty response)";
      } else if (proxyUrl) {
        // Production path: Supabase Edge Function proxy
        const res = await fetch(proxyUrl, {
          method: "POST",
          headers: {
            apikey: cfg.supabaseAnonKey || "",
            Authorization: `Bearer ${cfg.supabaseAnonKey || ""}`,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ prompt: ctx }),
        });
        if (!res.ok) throw new Error("proxy_error");
        const data = await res.json();
        reply = data.content?.[0]?.text ?? "(empty response)";
      } else {
        // Fallback: demo mode
        reply = "AI is not configured yet. Add your Supabase URL + anon key, then deploy the ai-proxy Edge Function (or set anthropicKey for local dev). See supabase.js for instructions.";
      }

      setMessages((m) => [...m, { role: "ai", text: reply }]);
    } catch (err) {
      setMessages((m) => [...m, { role: "ai", text: `Couldn't reach the model just now (${err.message}). Try again in a moment.` }]);
    } finally {
      setBusy(false);
    }
  };

  if (!open) return null;
  return (
    <div className="ai-modal-scrim" onMouseDown={onClose}>
      <div className="ai-modal" onMouseDown={(e) => e.stopPropagation()}>
        <header className="ai-modal-head">
          <div className="ai-modal-title">
            <Icon.spark />
            <span>StoreOps AI</span>
            <span className="muted-tx">·</span>
            <span className="muted-tx mono">scope: {STORE.id}</span>
          </div>
          <div className="grow" />
          <span className="muted-tx mono"><Kbd>esc</Kbd> to close</span>
          <button className="iconbtn" onClick={onClose}><Icon.close /></button>
        </header>

        <div className="ai-modal-body" ref={scrollRef}>
          {messages.map((m, i) =>
          <div key={i} className={cx("ai-msg", `ai-msg-${m.role}`)}>
              <div className="ai-msg-role mono">{m.role === "ai" ? "AI" : "YOU"}</div>
              <div className="ai-msg-text">{renderWithCitations(m.text)}</div>
            </div>
          )}
          {busy &&
          <div className="ai-msg ai-msg-ai">
              <div className="ai-msg-role mono">AI</div>
              <div className="ai-msg-text"><span className="ai-typing"><i /><i /><i /></span></div>
            </div>
          }
        </div>

        <div className="ai-modal-suggest">
          {AI_SUGGESTIONS.map((s) =>
          <button key={s.q} className="chip" onClick={() => send(s.q)} disabled={busy}>{s.q}</button>
          )}
        </div>

        <form className="ai-modal-input" onSubmit={(e) => {e.preventDefault();send();}}>
          <input
            placeholder="Ask anything about this store…"
            value={input}
            onChange={(e) => setInput(e.target.value)}
            autoFocus
            disabled={busy} />
          
          <button className="btn primary" type="submit" disabled={busy || !input.trim()}>
            <Icon.send /> Send <Kbd>↵</Kbd>
          </button>
        </form>
      </div>
    </div>);

}

function renderWithCitations(text) {
  // wrap [X-1234] tags in monospace cite chips
  const parts = text.split(/(\[[A-Z]-\d+\])/g);
  return parts.map((p, i) =>
  /^\[[A-Z]-\d+\]$/.test(p) ?
  <a key={i} className="cite mono">{p.slice(1, -1)}</a> :
  <span key={i}>{p}</span>
  );
}
