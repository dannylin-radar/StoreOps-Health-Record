function App() {
  const [tweaks, setTweak] = useTweaks(window.__TWEAK_DEFAULTS__ || {});
  const [tab, setTab]           = useState("overview");
  const [aiOpen, setAiOpen]     = useState(false);
  const [flagOpen, setFlagOpen] = useState(false);
  const [phaseOpen, setPhaseOpen] = useState(null);
  const [subState, setSubState]   = useState({});
  const [phaseTasks, setPhaseTasks] = useState({});

  const [entries,   setEntries]   = useState(TIMELINE);
  const [liveTasks, setLiveTasks] = useState(TASKS);
  const [liveFlags, setLiveFlags] = useState(FLAGS);
  const [liveFiles, setLiveFiles] = useState(FILES);
  const [liveTeam,  setLiveTeam]  = useState(TEAM);
  const [storeData, setStoreData] = useState(STORE);
  const [allStores, setAllStores] = useState([STORE]);
  const [loading,   setLoading]   = useState(false);
  const [dbError,   setDbError]   = useState(null);
  const [toast,     setToast]     = useState(null);
  const [editStoreOpen, setEditStoreOpen] = useState(false);
  const [addStoreOpen,  setAddStoreOpen]  = useState(false);
  const [teamOpen,      setTeamOpen]      = useState(false);
  const composerRef = useRef();

  // ── Load from Supabase on mount ──────────────────────────
  useEffect(() => {
    if (!SB.configured()) return;
    setLoading(true);
    Promise.all([
      SB.getEntries(STORE.id),
      SB.getTasks(STORE.id),
      SB.getFlags(STORE.id),
      SB.getFiles(STORE.id),
      SB.getTeam(STORE.id),
      SB.listStores(),
    ]).then(([dbEntries, dbTasks, dbFlags, dbFiles, dbTeam, dbStores]) => {
      if (dbEntries?.length) setEntries(dbEntries.map(dbRowToEntry));
      if (dbTasks?.length)   setLiveTasks(dbTasks.map(dbRowToTask));
      if (dbFlags?.length)   setLiveFlags(dbFlags.map(dbRowToFlag));
      if (dbFiles?.length)   setLiveFiles(dbFiles.map(dbRowToFile));
      if (dbTeam?.length)    setLiveTeam(dbTeam.map((r) => ({
        name: r.name, role: r.role, team: r.team,
        load: r.load, initials: r.initials, since: r.since,
      })));
      if (dbStores?.length)  setAllStores(dbStores.map(rowToStore));
    }).catch((e) => setDbError(e.message))
      .finally(() => setLoading(false));
  }, []);

  const flashToast = (msg, isError = false) => {
    setToast({ msg, isError });
    setTimeout(() => setToast(null), 3200);
  };

  const nowStamp = () => {
    const now = new Date();
    return `${now.toLocaleString("en-US",{month:"short",day:"numeric"})} · ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
  };

  const goToNotes = () => {
    setTab("notes");
    setTimeout(() => {
      const ta = composerRef.current?.querySelector("textarea");
      ta?.focus();
      composerRef.current?.scrollIntoView?.({ block: "start", behavior: "smooth" });
    }, 30);
  };

  // ── Post note ────────────────────────────────────────────
  const postNote = async (n) => {
    const t = nowStamp();
    setEntries((es) => [{ ...n, t }, ...es]);
    flashToast(n.action
      ? `Note posted · assigned to ${n.team}${n.due && n.due !== "—" ? ` · due ${n.due}` : ""}`
      : "Note posted");
    if (!SB.configured()) return;
    try {
      await SB.insertEntry({
        store_id: STORE.id, t, who: n.who || "Priya Shah",
        team: n.team, kind: n.kind || "note", sev: n.sev,
        title: n.title, body: n.body, action: n.action || false,
        due: n.due, mentions: n.mentions, attachment: n.attachment,
      });
    } catch (e) { flashToast("Sync failed: " + e.message, true); }
  };

  // ── Create task ──────────────────────────────────────────
  const createTask = async (taskData) => {
    const id = `T-${Date.now()}`;
    const newTask = { id, state: "Open", flag: null, ...taskData };
    setLiveTasks((ts) => [newTask, ...ts]);
    flashToast(`Task created`);
    if (!SB.configured()) return;
    try {
      const row = await SB.insertTask({
        id, store_id: STORE.id, title: taskData.title,
        state: "Open", owner: taskData.owner || "", due: taskData.due || "—", flag: null,
      });
      if (row?.id && row.id !== id)
        setLiveTasks((ts) => ts.map((t) => t.id === id ? dbRowToTask(row) : t));
    } catch (e) { flashToast("Sync failed: " + e.message, true); }
  };

  // ── Update task state ────────────────────────────────────
  const updateTaskState = async (taskId, newState) => {
    setLiveTasks((ts) => ts.map((t) => t.id === taskId ? { ...t, state: newState } : t));
    flashToast(`Task → ${newState}`);
    if (!SB.configured()) return;
    try {
      await SB.patchTask(taskId, { state: newState, updated_at: new Date().toISOString() });
    } catch (e) { flashToast("Sync failed: " + e.message, true); }
  };

  // ── Raise flag ───────────────────────────────────────────
  const submitFlag = async ({ label, tone, team, reason }) => {
    const t = nowStamp();
    setLiveFlags((fs) => [{ label, tone, team, since: "just now" }, ...fs]);
    setEntries((es) => [{
      kind: "note", who: "Priya Shah", team, sev: tone,
      title: `Flag raised: ${label}`, body: reason || "—",
      action: true, due: "—", mentions: [`@${team.toLowerCase().replace(/ /g,"")}`], t,
    }, ...es]);
    setFlagOpen(false);
    flashToast(`Flag raised · assigned to ${team}`);
    if (!SB.configured()) return;
    try {
      await Promise.all([
        SB.insertFlag({ store_id: STORE.id, label, tone, team, since: "just now" }),
        SB.insertEntry({ store_id: STORE.id, t, who: "Priya Shah", team, kind: "note", sev: tone,
          title: `Flag raised: ${label}`, body: reason || "—",
          action: true, due: "—", mentions: [`@${team.toLowerCase().replace(/ /g,"")}`] }),
      ]);
    } catch (e) { flashToast("Sync failed: " + e.message, true); }
  };

  // ── Upload file ──────────────────────────────────────────
  const uploadFile = async (file) => {
    const optimistic = { name: file.name, size: "…", who: "me", when: "just now" };
    setLiveFiles((fs) => [optimistic, ...fs]);
    if (!SB.configured()) { flashToast("Configure Supabase to persist files"); return; }
    try {
      const row = await SB.uploadFile(STORE.id, file, "Priya Shah");
      setLiveFiles((fs) => fs.map((f) => f === optimistic ? dbRowToFile(row) : f));
      flashToast(`${file.name} uploaded`);
    } catch (e) {
      setLiveFiles((fs) => fs.filter((f) => f !== optimistic));
      flashToast("Upload failed: " + e.message, true);
    }
  };

  // ── Phase helpers ─────────────────────────────────────────
  const toggleSub = (phase, i) => {
    const k = `${phase}:${i}`;
    const prevDone = subState[k] ?? PHASE_DETAIL[phase].subtasks[i].done;
    setSubState((s) => ({ ...s, [k]: !prevDone }));
    flashToast(`${PHASE_DETAIL[phase].subtasks[i].label} → ${!prevDone ? "done" : "open"}`);
  };
  const postPhaseNote = (phase, text) => postNote({
    kind: "note", who: "Priya Shah", team: PHASE_DETAIL[phase].owner, sev: "info",
    title: `[${phase}] ${text.split("\n")[0].slice(0, 80)}`, body: text, action: false,
  });
  const createPhaseTask = async (phase, { title, team, due }) => {
    const id = `T-${Date.now()}`;
    setPhaseTasks((pt) => ({ ...pt, [phase]: [...(pt[phase] || []), { id, title, team, due, state: "Open" }] }));
    const t = nowStamp();
    const entry = { kind: "task", who: "Priya Shah", team, sev: "info",
      title: `[${phase}] Task created: ${title}`,
      body: `Assigned to ${team} · due ${due}`, action: true, due, t };
    setEntries((es) => [entry, ...es]);
    flashToast(`Task created · assigned to ${team}`);
    if (!SB.configured()) return;
    try {
      await Promise.all([
        SB.insertTask({ id, store_id: STORE.id, title, state: "Open", owner: team, due: due || "—" }),
        SB.insertEntry({ store_id: STORE.id, ...entry }),
      ]);
    } catch (e) { flashToast("Sync failed: " + e.message, true); }
  };

  // ── Save store edits ─────────────────────────────────────
  const saveStore = async (updated) => {
    setStoreData(updated);
    setAllStores((ss) => ss.map((s) => s.id === updated.id ? updated : s));
    setEditStoreOpen(false);
    flashToast("Store details saved");
    if (!SB.configured()) return;
    try {
      await SB.patchStore(updated.id, {
        retailer: updated.retailer, store_num: updated.storeNum,
        name: updated.name, address: updated.address, region: updated.region,
        phase: updated.phase, health: updated.health,
        owner: updated.owner, owner_person: updated.ownerPerson,
        next_action: updated.nextAction, due: updated.due,
        sqft: updated.sqft, scheduled_live: updated.scheduledLive,
        updated_at: new Date().toISOString(),
      });
    } catch (e) { flashToast("Sync failed: " + e.message, true); }
  };

  // ── Add new store ─────────────────────────────────────────
  const addStore = async (newStore) => {
    setAllStores((ss) => [newStore, ...ss]);
    setAddStoreOpen(false);
    flashToast(`Store ${newStore.id} added`);
    if (!SB.configured()) return;
    try {
      await SB.insertStore({
        id: newStore.id, retailer: newStore.retailer,
        retailer_code: newStore.retailerCode || newStore.id.split("-")[0],
        store_num: newStore.storeNum, name: newStore.name,
        address: newStore.address, region: newStore.region,
        phase: newStore.phase, health: newStore.health,
        owner: newStore.owner, owner_person: newStore.ownerPerson,
        next_action: newStore.nextAction, due: newStore.due,
        sqft: newStore.sqft, scheduled_live: newStore.scheduledLive,
        opened_on: newStore.openedOn, due_delta: newStore.dueDelta,
        risk: newStore.risk, fixture_count: newStore.fixtureCount, skus: newStore.skus,
      });
    } catch (e) { flashToast("Sync failed: " + e.message, true); }
  };

  // ── Save team ─────────────────────────────────────────────
  const saveTeam = async (members) => {
    setLiveTeam(members);
    setTeamOpen(false);
    flashToast("Team saved");
    if (!SB.configured()) return;
    try {
      await SB.replaceTeam(STORE.id, members);
    } catch (e) { flashToast("Sync failed: " + e.message, true); }
  };

  // ── Hotkeys ───────────────────────────────────────────────
  useEffect(() => {
    const onKey = (e) => {
      if (e.target.matches?.("input, textarea, select")) return;
      const map = { "1":"overview","2":"timeline","3":"notes","4":"tasks","5":"comms","6":"files","7":"audit" };
      if (map[e.key]) setTab(map[e.key]);
      if (e.key.toLowerCase() === "n" && !e.metaKey && !e.ctrlKey) { e.preventDefault(); goToNotes(); }
      if (e.key.toLowerCase() === "f" && !e.metaKey && !e.ctrlKey) { e.preventDefault(); setFlagOpen(true); }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "j") { e.preventDefault(); setAiOpen((o) => !o); }
      if (e.key === "Escape") { setAiOpen(false); setFlagOpen(false); setPhaseOpen(null); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  // ── Tweaks → CSS ──────────────────────────────────────────
  useEffect(() => {
    const r = document.documentElement;
    r.dataset.theme   = tweaks.dark    ? "dark" : "light";
    r.dataset.density = tweaks.density;
    r.dataset.showKbd = tweaks.showKbd ? "true" : "false";
    r.style.setProperty("--accent-h", tweaks.accentHue);
  }, [tweaks]);

  return (
    <div className="app">
      <LeftNav stores={allStores} onAddStore={() => setAddStoreOpen(true)} />
      <main className="main">
        <StoreHeader store={storeData} tweaks={tweaks} onNewNote={goToNotes} onFlag={() => setFlagOpen(true)} onPhaseSelect={setPhaseOpen} onEdit={() => setEditStoreOpen(true)} />
        <TabBar active={tab} onSelect={setTab} />

        {!SB.configured() && (
          <div className="config-banner">
            ⚠ Supabase not configured — changes won't persist after refresh.
            Fill in <code>window.__STOREOPS_CONFIG__</code> in index.html.
          </div>
        )}
        {dbError && (
          <div className="config-banner config-banner-error">
            ⚠ Supabase error: {dbError}
          </div>
        )}

        <div className="content">
          <div className="content-main">
            {loading && <div className="loading-bar" />}
            {tab === "overview" && <Overview flags={liveFlags} tasks={liveTasks} />}
            {tab === "timeline" && <Timeline entries={entries} />}
            {tab === "notes"    && <Notes notes={entries.filter((e) => e.kind === "note")} composerRef={composerRef} onPost={postNote} />}
            {tab === "tasks"    && <Tasks tasks={liveTasks} onCreate={createTask} onStateChange={updateTaskState} />}
            {tab === "comms"    && <Comms />}
            {tab === "files"    && <Files files={liveFiles} onUpload={uploadFile} />}
            {tab === "audit"    && <Audit />}
          </div>
          {tweaks.showRail && <RightRail onAskAI={() => setAiOpen(true)} flags={liveFlags} onFlag={() => setFlagOpen(true)} team={liveTeam} onEditTeam={() => setTeamOpen(true)} />}
        </div>
      </main>

      <button className={cx("ai-fab", aiOpen && "is-open")} onClick={() => setAiOpen((o) => !o)} title="Ask AI (⌘J)">
        <Icon.spark /><span>Ask AI</span><Kbd>⌘J</Kbd>
      </button>

      <AIModal open={aiOpen} onClose={() => setAiOpen(false)} />
      <FlagModal open={flagOpen} onClose={() => setFlagOpen(false)} onSubmit={submitFlag} />
      <StoreEditModal store={storeData} open={editStoreOpen} onClose={() => setEditStoreOpen(false)} onSave={saveStore} />
      <AddStoreModal open={addStoreOpen} onClose={() => setAddStoreOpen(false)} onAdd={addStore} />
      <TeamModal open={teamOpen} onClose={() => setTeamOpen(false)} team={liveTeam} onSave={saveTeam} />
      <PhaseDrawer
        phase={phaseOpen}
        onClose={() => setPhaseOpen(null)}
        subState={subState}
        onToggleSub={toggleSub}
        onPostNote={postPhaseNote}
        onCreateTask={createPhaseTask}
        phaseTasks={phaseOpen ? (phaseTasks[phaseOpen] || []) : []}
        phaseNotes={phaseOpen ? entries.filter((e) => e.kind === "note" && e.title?.startsWith(`[${phaseOpen}]`)) : []}
      />

      {toast && (
        <div className={cx("toast", toast.isError && "toast-error")}>
          {toast.isError ? <Icon.flag /> : <Icon.check />}
          <span>{toast.msg}</span>
        </div>
      )}

      <TweaksPanel title="Tweaks">
        <TweakSection title="Appearance">
          <TweakToggle label="Dark mode"  value={tweaks.dark}      onChange={(v) => setTweak("dark", v)} />
          <TweakRadio  label="Density"    value={tweaks.density}   options={[{value:"compact",label:"Compact"},{value:"comfy",label:"Comfy"}]} onChange={(v) => setTweak("density", v)} />
          <TweakSlider label="Accent hue" value={tweaks.accentHue} min={0} max={360} step={5} onChange={(v) => setTweak("accentHue", v)} />
        </TweakSection>
        <TweakSection title="Layout">
          <TweakToggle label="Show right rail"     value={tweaks.showRail}  onChange={(v) => setTweak("showRail", v)} />
          <TweakToggle label="Show keyboard hints" value={tweaks.showKbd}   onChange={(v) => setTweak("showKbd", v)} />
          <TweakToggle label="Show phase strip"    value={tweaks.showPhase} onChange={(v) => setTweak("showPhase", v)} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

// STORE EDIT MODAL
// Edit store details: name, address, phase, health, owner, etc.

function StoreEditModal({ store, open, onClose, onSave }) {

  if (!open) return null;
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  const submit = (e) => {
    e.preventDefault();
    onSave(form);
  };

  return (
    <div className="ai-modal-scrim" onMouseDown={onClose}>
      <form className="ai-modal store-edit-modal" onMouseDown={(e) => e.stopPropagation()} onSubmit={submit}>
        <header className="ai-modal-head">
          <div className="ai-modal-title">
            <Icon.paper /><span>Edit store</span>
            <span className="muted-tx mono">· {store.id}</span>
          </div>
          <div className="grow" />
          <span className="muted-tx mono"><Kbd>esc</Kbd></span>
          <button type="button" className="iconbtn" onClick={onClose}><Icon.close /></button>
        </header>

        <div className="flag-body">
          <label className="field">
            <span className="field-l">Store ID</span>
            <input value={form.id} onChange={(e) => set("id", e.target.value)} placeholder="e.g. WFM-1247" />
          </label>
          <label className="field">
            <span className="field-l">Retailer</span>
            <input value={form.retailer} onChange={(e) => set("retailer", e.target.value)} placeholder="e.g. Whole Foods Market" />
          </label>
          <label className="field">
            <span className="field-l">Store #</span>
            <input value={form.storeNum} onChange={(e) => set("storeNum", e.target.value)} placeholder="e.g. 1247" />
          </label>
          <label className="field">
            <span className="field-l">Name</span>
            <input value={form.name} onChange={(e) => set("name", e.target.value)} placeholder="e.g. Cambridge — Charles Sq" />
          </label>
          <label className="field">
            <span className="field-l">Address</span>
            <input value={form.address} onChange={(e) => set("address", e.target.value)} placeholder="Street, City State ZIP" />
          </label>
          <label className="field">
            <span className="field-l">Region</span>
            <input value={form.region} onChange={(e) => set("region", e.target.value)} placeholder="e.g. Northeast / NE-04" />
          </label>
          <div className="field">
            <span className="field-l">Phase</span>
            <select className="select-ish mono" value={form.phase} onChange={(e) => set("phase", e.target.value)}>
              {["Planning","Scheduled","COI","Deployment","Live"].map((p) => <option key={p}>{p}</option>)}
            </select>
          </div>
          <div className="field">
            <span className="field-l">Health</span>
            <div className="sev-seg">
              {[["green","green"],["yellow","yellow"],["red","red"]].map(([v, label]) => (
                <button type="button" key={v}
                  className={cx("sev-btn", form.health === v && "is-on")}
                  onClick={() => set("health", v)}>
                  <Dot tone={v} /> {label}
                </button>
              ))}
            </div>
          </div>
          <label className="field">
            <span className="field-l">Owner team</span>
            <select className="select-ish mono" value={form.owner} onChange={(e) => set("owner", e.target.value)}>
              {TEAMS.map((t) => <option key={t.id}>{t.id}</option>)}
            </select>
          </label>
          <label className="field">
            <span className="field-l">Owner person</span>
            <input value={form.ownerPerson} onChange={(e) => set("ownerPerson", e.target.value)} placeholder="e.g. Priya Shah" />
          </label>
          <label className="field">
            <span className="field-l">Next action</span>
            <input value={form.nextAction} onChange={(e) => set("nextAction", e.target.value)} placeholder="e.g. Get signed COI" />
          </label>
          <label className="field">
            <span className="field-l">Due</span>
            <input className="mono" value={form.due} onChange={(e) => set("due", e.target.value)} placeholder="May 6" />
          </label>
          <div className="field-row-2">
            <label className="field">
              <span className="field-l">Sqft</span>
              <input className="mono" value={form.sqft} onChange={(e) => set("sqft", e.target.value)} placeholder="48,200" />
            </label>
            <label className="field">
              <span className="field-l">Go-live</span>
              <input className="mono" value={form.scheduledLive} onChange={(e) => set("scheduledLive", e.target.value)} placeholder="May 18, 2026" />
            </label>
          </div>
        </div>

        <div className="flag-foot">
          <button type="button" className="btn ghost" onClick={onClose}>Cancel</button>
          <button type="submit" className="btn primary"><Icon.check /> Save changes</button>
        </div>
      </form>
    </div>
  );
}

function AddStoreModal({ open, onClose, onAdd }) {

    region: "", phase: "Planning", health: "green", owner: "Implementation",
    ownerPerson: "", nextAction: "", due: "", sqft: "", scheduledLive: "",
    openedOn: new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}),

          <label className="field">
            <span className="field-l">Store #</span>
            <input value={form.storeNum} onChange={(e) => set("storeNum", e.target.value)} placeholder="e.g. 1248" />
          </label>
          <label className="field">
            <span className="field-l">Name</span>
            <input value={form.name} onChange={(e) => set("name", e.target.value)} placeholder="e.g. Boston — Back Bay" />

}

// ============================================================
// TEAM MANAGER MODAL
// Add, edit, remove team members
// ============================================================
function TeamModal({ open, onClose, team, onSave }) {
  const [members, setMembers] = useState(team);
  const [editIdx, setEditIdx] = useState(null);
  const [form, setForm] = useState(null);

  useEffect(() => { if (open) { setMembers(team); setEditIdx(null); setForm(null); } }, [open, team]);
  useEffect(() => {
    if (!open) return;
    const h = (e) => { if (e.key === "Escape") { if (editIdx !== null) { setEditIdx(null); setForm(null); } else onClose(); } };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [open, onClose, editIdx]);

  if (!open) return null;

  const startEdit = (i) => {
    setEditIdx(i);
    setForm(i === "new"
      ? { name: "", role: "", team: "Implementation", load: "active", initials: "", since: new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"}) }
      : { ...members[i] });
  };

  const saveEdit = () => {
    if (!form.name.trim()) return;
    const initials = form.initials.trim() ||
      form.name.trim().split(" ").map((w) => w[0]).join("").slice(0, 2).toUpperCase();
    const member = { ...form, initials };
    if (editIdx === "new") {
      setMembers((m) => [...m, member]);
    } else {
      setMembers((m) => m.map((x, i) => i === editIdx ? member : x));
    }
    setEditIdx(null);
    setForm(null);
  };

  const remove = (i) => {
    setMembers((m) => m.filter((_, idx) => idx !== i));
  };

  return (
    <div className="ai-modal-scrim" onMouseDown={onClose}>
      <div className="ai-modal team-modal" onMouseDown={(e) => e.stopPropagation()}>
        <header className="ai-modal-head">
          <div className="ai-modal-title"><Icon.flag /><span>Team members</span></div>
          <div className="grow" />
          <span className="muted-tx mono"><Kbd>esc</Kbd></span>
          <button className="iconbtn" onClick={onClose}><Icon.close /></button>
        </header>

        <div className="team-modal-body">
          {/* Member list */}
          <ul className="team-edit-list">
            {members.map((m, i) => (
              <li key={i} className={cx("team-edit-row", editIdx === i && "is-editing")}>
                {editIdx === i ? (
                  <div className="team-inline-form">
                    <input className="team-field" placeholder="Full name *" value={form.name} onChange={(e) => setForm((f) => ({...f, name: e.target.value}))} autoFocus />
                    <input className="team-field" placeholder="Role / title" value={form.role} onChange={(e) => setForm((f) => ({...f, role: e.target.value}))} />
                    <select className="select-ish mono" value={form.team} onChange={(e) => setForm((f) => ({...f, team: e.target.value}))}>
                      {TEAMS.map((t) => <option key={t.id}>{t.id}</option>)}
                    </select>
                    <select className="select-ish mono" value={form.load} onChange={(e) => setForm((f) => ({...f, load: e.target.value}))}>
                      {["primary","active","watching"].map((l) => <option key={l}>{l}</option>)}
                    </select>
                    <input className="team-field mono" placeholder="Initials (auto)" value={form.initials} onChange={(e) => setForm((f) => ({...f, initials: e.target.value}))} style={{width: 70}} />
                    <div className="team-form-actions">
                      <button className="btn primary sm" onClick={saveEdit} disabled={!form.name.trim()}><Icon.check /> Save</button>
                      <button className="btn ghost sm" onClick={() => { setEditIdx(null); setForm(null); }}>Cancel</button>
                    </div>
                  </div>
                ) : (
                  <>
                    <span className="avatar avatar-sm mono">{m.initials}</span>
                    <div className="contact-text">
                      <div className="contact-name">{m.name}</div>
                      <div className="contact-sub">{m.role} · {m.team}</div>
                    </div>
                    <Pill tone={m.load === "primary" ? "watch" : "info"}>{m.load}</Pill>
                    <button className="btn ghost sm" onClick={() => startEdit(i)}>Edit</button>
                    <button className="btn ghost sm" onClick={() => remove(i)} style={{color:"var(--bad)"}}>Remove</button>
                  </>
                )}
              </li>
            ))}
          </ul>

          {/* Add new */}
          {editIdx === "new" ? (
            <div className="team-inline-form team-new-form">
              <input className="team-field" placeholder="Full name *" value={form.name} onChange={(e) => setForm((f) => ({...f, name: e.target.value}))} autoFocus />
              <input className="team-field" placeholder="Role / title" value={form.role} onChange={(e) => setForm((f) => ({...f, role: e.target.value}))} />
              <select className="select-ish mono" value={form.team} onChange={(e) => setForm((f) => ({...f, team: e.target.value}))}>
                {TEAMS.map((t) => <option key={t.id}>{t.id}</option>)}
              </select>
              <select className="select-ish mono" value={form.load} onChange={(e) => setForm((f) => ({...f, load: e.target.value}))}>
                {["primary","active","watching"].map((l) => <option key={l}>{l}</option>)}
              </select>
              <div className="team-form-actions">
                <button className="btn primary sm" onClick={saveEdit} disabled={!form.name.trim()}><Icon.plus /> Add</button>
                <button className="btn ghost sm" onClick={() => { setEditIdx(null); setForm(null); }}>Cancel</button>
              </div>
            </div>
          ) : (
            <button className="btn ghost" style={{marginTop: 8}} onClick={() => startEdit("new")}>
              <Icon.plus /> Add team member
            </button>
          )}
        </div>

        <div className="flag-foot">
          <span className="muted-tx mono">{members.length} members</span>
          <div className="grow" />
          <button className="btn ghost" onClick={onClose}>Cancel</button>
          <button className="btn primary" onClick={() => onSave(members)}><Icon.check /> Save team</button>
        </div>
      </div>
    </div>
  );
}
</script>
